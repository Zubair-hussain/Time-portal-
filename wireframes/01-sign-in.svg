<text x="726" y="612" font-family="'Hanken Grotesk', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<g transform="translate(1464 24)"><text font-family="'Hanken Grotesk', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#222" y="0">Notes</text><g transform="translate(0 28)"><circle cx="11" cy="-4" r="11" fill="#2f6fed"/><text x="11" y="0" font-family="'Hanken Grotesk', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><foreignObject x="30" y="-18" width="290" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="font:13px/1.35 'Hanken Grotesk', Helvetica, Arial, sans-serif;color:#333">Retro CRT: idle shows ZH. + READY; plays a loading bar while signing in.</div></foreignObject></g><g transform="translate(0 74)"><circle cx="11" cy="-4" r="11" fill="#2f6fed"/><text x="11" y="0" font-family="'Hanken Grotesk', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><foreignObject x="30" y="-18" width="290" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="font:13px/1.35 'Hanken Grotesk', Helvetica, Arial, sans-serif;color:#333">Logo: portfolio "ZH." mark (vector) + "Time Portal".</div></foreignObject></g><g transform="translate(0 120)"><circle cx="11" cy="-4" r="11" fill="#2f6fed"/><text x="11" y="0" font-family="'Hanken Grotesk', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><foreignObject x="30" y="-18" width="290" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="font:13px/1.35 'Hanken Grotesk', Helvetica, Arial, sans-serif;color:#333">No sign-up link anywhere: accounts are created by admins.</div></foreignObject></g><g transform="translate(0 166)"><circle cx="11" cy="-4" r="11" fill="#2f6fed"/><text x="11" y="0" font-family="'Hanken Grotesk', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><foreignObject x="30" y="-18" width="290" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="font:13px/1.35 'Hanken Grotesk', Helvetica, Arial, sans-serif;color:#333">Show / hide password toggle.</div></foreignObject></g><g transform="translate(0 212)"><circle cx="11" cy="-4" r="11" fill="#2f6fed"/><text x="11" y="0" font-family="'Hanken Grotesk', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text><foreignObject x="30" y="-18" width="290" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="font:13px/1.35 'Hanken Grotesk', Helvetica, Arial, sans-serif;color:#333">Primary action. Errors appear above it (role="alert").</div></foreignObject></g></g>
