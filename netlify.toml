# Netlify: static Next.js export. Security headers come from public/_headers (copied into out/).
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Unknown paths fall back to the exported 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
